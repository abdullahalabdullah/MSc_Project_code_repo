# =============================================================================
# RO2 MVP — Harmlessness SFT training config (Qwen3-4B, LoRA).
# =============================================================================
# The whole full run is described by this single file. The sanity-check config
# (configs/sft_harmlessness_sanity.yaml) only overrides a handful of keys and is
# deep-merged on top of this one by scripts/sanity_check_sft.py.
#
# Before running:
#   - set hf_username (and repo_prefix if you want a different name),
#   - confirm max_length with scripts/00_check_seq_length.py.
# =============================================================================

# --- Model -------------------------------------------------------------------
base_model: "Qwen/Qwen3-4B"
# attn_implementation: "sdpa" works everywhere (no extra install). Set to
# "flash_attention_2" only if flash-attn is installed for the pod's CUDA/torch.
attn_implementation: "sdpa"

# --- Output / Hub ------------------------------------------------------------
# Local scratch dir for TRL checkpoints (one per epoch). On RunPod, keep this
# under /workspace so it survives pod restarts. The deliverables are the adapter
# repos on the Hub, pushed by scripts/02_push_adapters.py.
output_dir: "./outputs/qwen3-4b-sft-harmlessness"
hf_username: "er-abd"
repo_prefix: "qwen3-4b-sft-harmlessness-pku-adapter"   # -> <user>/<prefix>-epoch{1,2,3}
sanity_repo: "qwen3-4b-sft-harmlessness-pku-adapter-sanitytest"  # throwaway repo for the gate
# Standalone MERGED models for the MVP-RO1 vLLM eval pipeline (scripts/04_merge_and_push.py).
merged_repo_prefix: "qwen3-4b-sft-harmlessness-pku-merged"   # -> <user>/<prefix>-epoch{N}

# --- Dataset -----------------------------------------------------------------
dataset: "PKU-Alignment/PKU-SafeRLHF"
dataset_split: "train"
# Conflict-case filter (spec §3.2): exactly one of the two responses is safe.
# This is the definition that yields the spec's expected ~12,616 examples.
# The chosen (training) target is response_{safer_response_id}.
expected_conflict_size: 12616      # logged + compared; NOT a hard-fail
val_fraction: 0.10                 # 90% train / 10% eval split
split_seed: 42

# --- Formatting --------------------------------------------------------------
# Train in NON-thinking mode (spec §2/§3.4): chosen responses are plain text.
enable_thinking_train: false
# Set with scripts/00_check_seq_length.py. PKU-SafeRLHF conflict cases are short
# (p99 ~288, max ~1218 tokens), so 1024 keeps all but 1 example whole. Dynamic
# padding pads to the longest sequence per batch, so this mainly controls
# truncation of rare outliers, not per-step compute.
max_length: 1024

# --- LoRA (spec §5) ----------------------------------------------------------
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

# --- Training (spec §5 "Training Configuration") -----------------------------
num_train_epochs: 3                # 3 epochs -> 3 per-epoch checkpoints
per_device_train_batch_size: 32    # 80GB A100 has plenty of headroom (4B+LoRA, short seqs)
gradient_accumulation_steps: 1     # 32 * 1 = 32 effective batch size (unchanged dynamics)
per_device_eval_batch_size: 2
optim: "adamw_torch_fused"         # use "paged_adamw_8bit" (needs bitsandbytes) if OOM
learning_rate: 2.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true       # safe default: no OOM risk on long-outlier batches
logging_steps: 10
save_strategy: "epoch"             # checkpoint at the end of each epoch
eval_strategy: "epoch"             # eval_loss at the end of each epoch
save_total_limit: null             # keep ALL epoch checkpoints
seed: 42

# --- Sanity / debugging knobs (full run leaves these as-is) ------------------
max_train_samples: null            # null = use the full filtered+split train set
max_steps: -1                      # -1 = train by epochs (sanity config sets a cap)
